# فُل مارك | FULL MARK
# منصة ألعاب تعليمية دون اتصال — الصف الثالث الثانوي العلمي، المنهج اليمني.
#
# إصدارات مثبّتة بعد التحقق عبر الويب بتاريخ 2026-11-25:
# - Flutter المستقر الحالي: 3.50.1 مع Dart 3.14.0 (صدر 20 تشرين الثاني/نوفمبر 2026).
#   مكتبة Material انتقلت رسمياً إلى حزمة material_ui بدءاً من Flutter 3.47
#   (فأصبح `package:flutter/material.dart` مهملاً)، لذا الحد الأدنى الآن
#   هو Flutter >=3.47 / Dart >=3.13، بينما يثبّت CI إصدار stable الأحدث.
# - sqflite الأحدث: 2.4.6 (نوفمبر 2026) — يفي بشرط المهمة (^2.4.2) ويتجاوزه.
# - path الأحدث: 1.9.1.
name: abqariya
description: "فُل مارك | FULL MARK — منصة ألعاب تعليمية دون اتصال للصف الثالث الثانوي العلمي (المنهج اليمني). افهم، جرّب، اكتشف، وتفوّق."
# منع النشر على pub.dev — هذا تطبيق وليس حزمة.
publish_to: "none"
version: 0.1.5+6

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # material_ui: مكتبة Material الرسمية (انتقلت من SDK بدءاً من 3.47).
  # كل واجهات التطبيق (MaterialApp، Scaffold، الأزرار...) تأتي منها.
  material_ui: ^1.11.1
  # cupertino_ui: مكتبة Cupertino الرسمية — نحتاجها فقط لترجمة عناصر
  # Cupertino (GlobalCupertinoLocalizations) بعد انتقالها من SDK.
  cupertino_ui: ^1.1.7
  # flutter_localizations: ترجمة عناصر Material (التواريخ، الأزرار...)
  # إلى العربية — ضرورية لتجربة RTL كاملة. جزء من SDK، بلا إنترنت.
  flutter_localizations:
    sdk: flutter
  # cupertino_icons: أيقونات iOS-style؛ مستخدمة لأيقونات بعض الأزرار.
  # ليست ضرورية للمنطق، ويمكن حذفها دون كسر التطبيق.
  cupertino_icons: ^1.0.8
  # sqflite: قاعدة بيانات SQLite محلية — كل التقدم والأسئلة والمحاولات
  # تُحفظ على الجهاز فقط. لا حسابات ولا خوادم ولا إنترنت.
  sqflite: ^2.4.6
  # path: بناء مسارات ملفات آمنة عبر المنصات (مسار ملف قاعدة البيانات).
  path: ^1.9.1
  # share_plus: ورقة المشاركة النظامية (ACTION_SEND) لتصدير ملف النسخة
  # الاحتياطية — تعمل دون اتصال ولا تضيف إذن إنترنت. مثبّتة على ^11
  # عمدًا: الإصدارات 12/13 غيّرت الواجهة مجددًا ولا يمكن التحقق من
  # ترجمتها محليًا (لا Flutter SDK هنا). في ^11 الواجهة الموثّقة هي
  # SharePlus.instance.share(ShareParams(...)) — الطرق الساكنة
  # Share.shareXFiles مهملة في 11.1.0، لذا نستخدم واجهة المثيل مع
  # fileNameOverrides (معامل name في XFile.fromData يُتجاهل في معظم
  # المنصات).
  share_plus: ^11.0.0
  # file_picker: نافذة حفظ/اختيار الملفات النظامية (SAF على أندرويد)
  # لتصدير النسخة الاحتياطية واستيرادها — تعمل دون اتصال ولا تضيف إذن
  # إنترنت. مثبّتة على ^8 عمدًا لنفس سبب share_plus: الإصدار 13 غيّر
  # نوع نتيجة pickFiles ولا يمكن التحقق من ترجمته محليًا؛ ^8 بواجهة
  # FilePickerResult وsaveFile/pickFiles المستقرة معروفة وتعمل.
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_lints: قواعد التحليل الرسمية (انظر analysis_options.yaml).
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # أصول خفيفة في v1: بيانات JSON فقط (هيكل المنهج + حزم الأسئلة الموثقة
  # + الأسئلة التجريبية + مخطط الاستيراد). لا صور ولا فيديو ولا محرك 3D ولا ملفات صوتية.
  assets:
    - assets/data/curriculum.json
    - assets/data/demo_questions.json
    - assets/data/questions/arabic.json
    - assets/data/questions/biology.json
    - assets/data/questions/chemistry.json
    - assets/data/questions/english.json
    - assets/data/questions/islamic.json
    - assets/data/questions/math.json
    - assets/data/questions/physics.json
    - assets/schema/content_schema.json
