name: Build APK

# Builds the ABQARIYA Android APK on every push to main and on PRs.
# Fully offline app — the workflow itself still needs the network at
# build time to fetch the Flutter SDK and pub dependencies (build-time
# only; the APK itself requests no INTERNET permission).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check manifest requests no INTERNET permission
        # The app is fully offline by design (master prompt §1, §12).
        # Any INTERNET permission here is a defect and fails the build.
        run: |
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: AndroidManifest requests INTERNET permission" >&2
            exit 1
          fi
          echo "OK: no INTERNET permission in manifest"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned by verification 2026-11-25: stable is 3.50.1 (Dart 3.14).
          # Keep the exact version in sync with pubspec/README when upgrading.
          flutter-version: "3.50.1"
          cache: true

      - name: Regenerate missing platform scaffolding if needed
        # Safety net: if android/ scaffolding is incomplete in the repo
        # (launcher icons or the Gradle wrapper), `flutter create .` fills
        # the gaps. Without --overwrite it never touches existing files
        # (lib/main.dart, pubspec.yaml, ...); it only creates missing ones.
        # It DOES create test/widget_test.dart from the Flutter 3.50
        # template, which imports package:material_ui and references the
        # template's MyApp — both absent from this project — so delete it
        # before analyze (our own tests live in test/ already).
        run: |
          if [ ! -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ] || [ ! -f android/gradlew ]; then
            echo "Platform scaffolding incomplete — regenerating"
            flutter create . --org com.abqariya --project-name abqariya --platforms android
            # Delete the generated template test ONLY if it is still the
            # template (material_ui import / MyApp): never delete a real
            # widget test written for this app.
            if grep -q "material_ui\|MyApp" test/widget_test.dart 2>/dev/null; then
              echo "Removing generated template test/widget_test.dart"
              rm -f test/widget_test.dart
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (split per ABI, keeps each APK small)
        run: flutter build apk --release --split-per-abi

      - name: Enforce 100 MB APK size limit
        # SIZE_BUDGET.md: the 100 MB limit applies to the APK the user
        # installs (split per ABI). Fail the build over the limit.
        run: |
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 104857600 ]; then
              echo "ERROR: $f exceeds the 100 MB limit ($size bytes)" >&2
              exit 1
            fi
          done
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abqariya-apk-release
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
